<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Forma–1 Adatbázis'">Forma–1 Adatbázis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/assets/css/fontawesome-all.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
    <noscript><link rel="stylesheet" th:href="@{/assets/css/noscript.css}" /></noscript>
</head>
<body class="is-preload">

<div id="wrapper">

    <section id="sidebar">
        <div class="inner">
            <nav>
                <ul>
                    <li><a th:href="@{index}">Főoldal</a></li>
                    <li><a th:href="@{adatbazis}">Adatbázis</a></li>
                    <li><a th:href="@{pilota}">Pilóták (CRUD)</a></li>
                    <li><a th:href="@{diagram}">Diagram</a></li>
                    <li><a th:href="@{kapcsolat}">Kapcsolat</a></li>
                    <li><a th:href="@{uzenetek}">Üzenetek</a></li>
                    <li><a th:href="@{logout}">Kijelentkezés</a></li>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{admin}">Admin felület</a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>

    <div id="main">
        <div class="inner">

            <div th:insert="${content}"></div>

        </div>
    </div>

</div>

<script th:src="@{/assets/js/jquery.min.js}"></script>
<script th:src="@{/assets/js/browser.min.js}"></script>
<script th:src="@{/assets/js/breakpoints.min.js}"></script>
<script th:src="@{/assets/js/util.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>

</body>
</html>
